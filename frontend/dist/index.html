    <script>
      // Pre-paint theme to avoid FOUC. Defaults to system preference;
      // App.tsx re-applies once persisted settings load.
      (function () {
        try {
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute(
            "data-theme",
            dark ? "dark" : "light",
          );
        } catch (_) {}
      })();
    </script>
    <div id="root"></div>
  </body>
