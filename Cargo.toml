[package]
name = "yt-dlp-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui = "0.29"
egui-wgpu = "0.29"
egui_extras = { version = "0.29", features = ["image", "http"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "webp", "png"] }
wgpu = "22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
once_cell = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
palette = { version = "0.7", features = ["serde"] }
anyhow = "1"
dotenvy = "0.15"
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
